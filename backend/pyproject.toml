[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-center-capacity-backend"
version = "0.1.0"
description = "Backend for the AI Data Center Capacity Planning Agent"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23,<26",
  "python-multipart>=0.0.12,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "prophet>=1.1,<2",
  "xgboost>=2.1,<4",
  "langgraph>=0.2,<2",
  "celery[redis]>=5.4,<6",
  "jinja2>=3.1,<4",
  "weasyprint>=62,<70",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
