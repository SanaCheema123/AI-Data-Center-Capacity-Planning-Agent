services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capacity
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capacity -d capacity"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass '$${REDIS_PASSWORD}'"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env.production]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://capacity:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/capacity
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      REPORT_OUTPUT_DIR: /app/artifacts/reports
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    volumes:
      - report_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env.production]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://capacity:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/capacity
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      REPORT_OUTPUT_DIR: /app/artifacts/reports
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    volumes:
      - report_artifacts:/app/artifacts
    restart: unless-stopped
    networks: [internal]

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env.production]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://capacity:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/capacity
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      REPORT_OUTPUT_DIR: /app/artifacts/reports
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO
    restart: unless-stopped
    networks: [internal]


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "80:80"
    restart: unless-stopped
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  report_artifacts:
